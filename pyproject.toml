[project]
name = "calendarapp"
dynamic = ["version"]
description = "Self-hosted calendar with CalDAV phone sync, your own free take on Google Calendar"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["flask==3.1.3", "waitress==3.0.2", "icalendar==7.3.0", "recurring-ical-events==3.8.2", "radicale==3.9.1", "x-wr-timezone==2.0.1", "python-dateutil==2.9.0.post0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.dynamic]
version = { attr = "calendarapp.__version__" }

[tool.setuptools.packages.find]
include = ["calendarapp*"]

[tool.setuptools.package-data]
calendarapp = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
